
services:
  postgres:
    image: postgres:17-alpine
    container_name: truehook-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truehook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-truehook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truehook -d truehook"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nats:
    image: nats:2.11-alpine
    container_name: truehook-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./infrastructure/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
